# AI 응답 잔재 패턴 사전(v3 §3-6). 코드와 분리해 규칙만 고칠 수 있게 둔다.
# objective: true  → 서면 작성 관행에 없는 객관적 흔적(보고서에 finding으로 싣는다)
# objective: false → 사람도 쓰는 문체 신호(AI 관여 추정치에만 약하게 반영, finding 없음)
# 어느 것도 AI 작성을 단정하는 근거가 아니다. 패턴은 대소문자를 가리지 않는다.
rules:
  - category: CHATBOT_PREFACE
    label: 대화형 응답 서두
    objective: true
    pattern: '(물론입니다|네[,!]?\s*알겠습니다|알겠습니다|좋습니다)\s*[!.]?[^\n]{0,80}?(작성해\s*(?:드리겠|드릴게|보겠)습니다|정리해\s*드리겠습니다|도와\s*드리겠습니다|작성하겠습니다)'
  - category: CHATBOT_CLOSING
    label: 챗봇 맺음말
    objective: true
    pattern: '(도움이\s*되(?:셨|었)(?:길|기를|으면)\s*바랍니다|(?:추가로|더)\s*궁금한\s*(?:점|사항)이\s*있(?:으시|으)면|추가적인\s*질문이\s*있으시면|언제든(?:지)?\s*(?:문의|말씀)해\s*주(?:세요|십시오)|(?:말씀|알려)\s*주세요\s*!)'
  - category: DISCLAIMER
    label: AI 면책·안내문
    objective: true
    pattern: '(법률\s*자문을\s*대체하지|법률\s*자문이\s*아닙니다|법률적\s*조언이\s*아니며|전문\s*변호사와\s*상담하시기)'
  - category: SOURCE_TOKEN
    label: 생성 도구의 출처 표시 토큰
    objective: true
    pattern: '(\[\s*출처\s*[:：]\s*\d+\s*\]|【\d+(?::\d+)?†[^】]{0,40}】|\bciteturn\d+\w*|:contentReference\[oaicite:\d+\]|\[\^\d+\^\])'
  - category: KNOWLEDGE_CUTOFF
    label: 모델 지식 기준일 언급
    objective: true
    pattern: '((?:제|저의)\s*(?:지식|학습\s*데이터)\s*(?:기준일?|기준으로|업데이트)|학습\s*데이터\s*기준|knowledge\s+cutoff|AI\s*(?:어시스턴트|모델|언어\s*모델)로서|인공지능으로서)'
  - category: MARKDOWN_TABLE
    label: 렌더링되지 않은 마크다운 표
    objective: true
    pattern: '(\|[^|\n]+\|[^\n]*?\s*\|\s*:?-{3,}:?\s*\|)'
  - category: MARKDOWN
    label: 마크다운 문법 잔재
    objective: false
    min_kinds: 3
    pattern: '(?m)(^\s*#{1,6}\s+\S[^\n]{0,40}|\*\*[^*\n]{1,40}\*\*)'
  - category: CHATBOT_SUMMARY
    label: 챗봇 답변식 요약·나열 도입구
    objective: false
    pattern: '(요약하자면|종합하자면|결론적으로\s*말씀드리면|다음과\s*같은\s*(?:점|측면|이유|법리)(?:들)?이\s*있습니다)'
  - category: CLICHE
    label: AI 답변 상투 표현
    objective: false
    min_kinds: 3
    pattern: '(결론적으로|종합적으로\s*볼\s*때|라고\s*할\s*수\s*있습니다|중요한\s*점은|핵심은|단계적으로\s*살펴보겠습니다|살펴보겠습니다)'
  - category: ENGLISH_GLOSS
    label: 한국어 법률 용어의 영문 병기
    objective: false
    case_sensitive: true
    pattern: '[(（''‘"“]\s*([a-z]+(?:\s+[a-z]+){1,4})\s*[)）''’"”]'
