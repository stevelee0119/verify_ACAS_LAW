coverage_note: 현행 별표 제공 파일 2개의 부호에, 제공 파일에 없는 부분을 연혁본 별표에서 보충했다(supplement_source
  참조). 두 곳 모두에 없는 부호는 표에 넣지 않았다(unknown).
