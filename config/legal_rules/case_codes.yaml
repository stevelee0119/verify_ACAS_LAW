overrides:
  누:
    supreme_court_until_year: 1998
    supreme_court_unknown_until_year: 1999
    supreme_court_basis: 공식 판례 DB에 대법원이 '누' 부호로 선고한 사건이 있다(대법원 1995. 7. 11. 선고 94누4615
      전원합의체 판결, https://www.law.go.kr/판례/(94누4615)). 현행 예규 별표의 '누'는 행정항소사건이고 제6조는
      고등법원 1심 행정사건에도 '누'를 쓴다. 대법원 '누'의 마지막 사용 연도는 공식 자료로 확인하지 못해, 2000년 이후 접수 연도만
      사용 기간 밖으로 보고 1998~1999년은 판단하지 않는다.
    human_review: true
level_basis:
  SUPREME: '상고·재항고·특별항고·비상상고 사건은 대법원 사건으로 본다. 확인한 원문(국가법령정보 API, 2026-09-24): 법원조직법
    제14조("대법원은 … 1. 고등법원 또는 항소법원ㆍ특허법원의 판결에 대한 상고사건 2. 항고법원ㆍ고등법원 또는 항소법원ㆍ특허법원의 결정ㆍ명령에
    대한 재항고사건 … 을 종심으로 심판한다"), 형사소송법 제371조("대법원에 상고할 수 있다"), 제441조("대법원에 비상상고를 할 수
    있다"), 민사소송법 제449조 제1항("대법원에 특별항고를 할 수 있다")'
  note: 항소·항고·1심 사건은 대법원·헌법재판소가 아닌 법원(하급법원) 사건으로만 본다. 고등법원·지방법원 구분은 하지 않는다(unknown).
constitutional_source:
  title: 헌법재판소 사건의 접수에 관한 규칙 제8조 제3항(사건부호표)
  url: https://www.law.go.kr/법령/헌법재판소사건의접수에관한규칙/제8조
  fetched: 2026-09-24 공식 원문 수집(국가법령정보 API)
exclusive_court_basis:
  특허법원:
    title: 법원조직법 제28조의4(심판권)
    text: 특허법원은 특허법 제186조제1항, 실용신안법 제33조, 디자인보호법 제166조제1항 및 상표법 제162조에서 정하는
      제1심사건 등을 심판한다. 특허1심사건 부호('허')가 붙은 사건은 특허법원 사건이다.
    url: https://www.law.go.kr/법령/법원조직법/제28조의4
    note: 반대 방향(특허법원 + 다른 부호)은 판단하지 않는다. 특허법원은 침해소송 항소사건(민사 항소 부호)도 심판한다.
military_codes_note: 군사법원 사건부호는 군사법원 예규로 정한다(군사법원 사무규칙). 부호 목록 원문을 확보하지 못해 표에 넣지
  않았다(unknown). 원문 확인 전에는 군사법원 사건부호로 판정하지 않는다.
