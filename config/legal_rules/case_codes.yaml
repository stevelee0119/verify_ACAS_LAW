    supreme_court_basis: 공식 판례 DB에 대법원이 '누' 부호로 선고한 사건이 있다(대법원 1995. 7. 11. 선고 94누4615
      전원합의체 판결, https://www.law.go.kr/판례/(94누4615)). 현행 예규 별표의 '누'는 행정항소사건이고 제6조는
      고등법원 1심 행정사건에도 '누'를 쓴다. 대법원 '누'의 마지막 사용 연도는 공식 자료로 확인하지 못해, 2000년 이후 접수 연도만
      사용 기간 밖으로 보고 1998~1999년은 판단하지 않는다.
