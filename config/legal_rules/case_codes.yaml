level_basis:
  SUPREME: 상고·재항고·특별항고·비상상고 사건은 대법원 관할(민사소송법 제422조·제442조·제449조, 형사소송법 제371조·제441조)
    — 공식 원문 수집으로 확인 예정
  note: 항소·항고·1심 사건은 대법원·헌법재판소가 아닌 법원(하급법원) 사건으로만 본다. 고등법원·지방법원 구분은 하지 않는다(unknown).
