  - url: https://www.law.go.kr/LSW/flDownload.do?flSeq=145616549
    sha256: b171df1dd317528dc981d0e0dfae4bebfb8ed15c5258a68432440e7cd1577e4a
  - url: https://www.law.go.kr/LSW/flDownload.do?flSeq=145616551
