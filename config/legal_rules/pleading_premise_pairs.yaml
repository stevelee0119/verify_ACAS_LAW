# 청구 구조 검토(PLEADING_STRUCTURE_REVIEW)의 전제 대립쌍.
#
# 청구취지에 법률관계의 '존속'을 전제로 한 청구와 '소멸·부존재'를 전제로 한 청구가 주위적·예비적 구분 없이
# 함께 있으면, 서로 양립할 수 없는 청구를 단순 병합한 것인지 법률가가 확인해야 한다. 이 표는 판정이 아니라 확인 요청의
# 근거다(SUSPICIOUS, 근거등급 C). 청구의 선후·병합 형태가 적법한지는 사람이 판단한다.
#
# 근거: 민사소송법 제253조(소의 객관적 병합) — 여러 청구를 하나의 소로 병합하는 요건. 논리적으로 양립할 수 없는 청구를
# 함께 구하려면 순위를 붙인 예비적 병합으로 구성한다는 병합 형태의 구분은 판례·실무 법리이며, 이 표는 특정 판례를
# 근거로 적지 않는다(원문 확인 전 사건번호를 적지 않는다).
#
# 항목: id, label, premise_a·premise_b(서로 반대되는 전제를 가진 청구 표현), 설명. 표현은 청구취지 항목마다 찾는다.
basis:
  - name: 민사소송법 제253조
    url: https://www.law.go.kr/법령/민사소송법/제253조
ordering_markers: '주위적|예비적'
pairs:
  - id: EMPLOYMENT
    label: 근로관계 존속 ↔ 근로관계 종료
    premise_a: '해고(?:가|는|처분이)?\s*무효(?:임을|라는\s*것을)?\s*확인|(?:근로자|직원|종업원)(?:의|로서의)?\s*지위에\s*있음을\s*확인|근로관계(?:가)?\s*존재(?:함을)?\s*확인'
    premise_b: '퇴직금|퇴직\s*급여'
    explanation: 해고무효·근로자 지위 확인은 근로관계가 계속됨을 전제로 하고, 퇴직금 청구는 근로관계가 끝났음을 전제로 한다.
  - id: CONTRACT
    label: 계약 유효 ↔ 계약 무효·취소·해제
    premise_a: '(?:계약|매매|도급|임대차|위임)(?:계약)?(?:이|은)?\s*유효(?:함을|하게\s*존속함을)?\s*확인|(?:매수인|수급인|임차인|수임인)(?:의)?\s*지위에\s*있음을\s*확인'
    premise_b: '(?:계약|매매|도급|위임)(?:계약)?(?:이|은)?\s*(?:무효|취소|해제|해지)(?:되었|됨|임|된\s*것)|원상회복|부당이득(?:금)?(?:을)?\s*반환'
    explanation: 계약이 유효함을 확인해 달라는 청구와, 계약이 무효·취소·해제되었음을 전제로 한 원상회복·부당이득반환 청구는 같은 계약의 효력을 반대로 전제한다.
  - id: LEASE
    label: 임대차 존속 ↔ 임대차 종료
    premise_a: '임차권(?:이)?\s*존재(?:함을)?\s*확인|임대차(?:계약)?(?:이|은)?\s*존속(?:함을)?\s*확인|임차인의\s*지위에\s*있음을\s*확인'
    premise_b: '(?:임대차\s*)?보증금(?:을)?\s*반환|(?:임대차\s*)?보증금\s*[0-9,]+\s*원(?:을)?\s*지급'
    explanation: 임대차가 존속함을 전제로 한 확인 청구와, 임대차 종료를 전제로 한 보증금 반환 청구는 같은 임대차의 존속을 반대로 전제한다.
  - id: MARRIAGE
    label: 혼인 부존재·무효 ↔ 유효한 혼인의 해소
    premise_a: '이혼한다|이혼(?:을)?\s*(?:청구|구한)|재산분할'
    premise_b: '혼인(?:이|은)?\s*무효(?:임을)?\s*확인|혼인(?:이|은)?\s*(?:부존재|존재하지\s*아니)(?:함)?(?:을)?\s*확인'
    explanation: 이혼·재산분할은 유효한 혼인을 전제로 하고, 혼인무효·부존재 확인은 유효한 혼인이 없음을 전제로 한다.
