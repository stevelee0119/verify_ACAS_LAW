# Render 배포 청사진(Blueprint).
# Dashboard → New → Blueprint → 저장소 선택 시 이 파일대로 생성된다.
#
# 주의
#  - OCR(tesseract)이 필요하므로 runtime은 docker를 쓴다. Native Python 런타임에는
#    시스템 패키지를 설치할 수 없어 스캔 문서 본문 추출이 UNVERIFIED로 남는다.
#  - 원본 보존(제15.1장)에는 영구 디스크가 필요하다. 디스크 없이 배포하면
#    재배포·재시작 때 업로드 원본과 감사 산출물이 사라진다. 무료 플랜은 디스크를
#    지원하지 않으므로 증거 보존이 필요하면 유료 플랜을 쓴다.
#  - API Key는 이 파일에 적지 않는다. sync:false 항목은 대시보드에서 직접 입력한다.
#  - 인증은 항상 켜져 있다. LV_BOOTSTRAP_ADMIN_EMAIL/PASSWORD를 넣지 않으면
#    유효한 계정이 없어 보호된 API에 접근할 수 없다.

services:
  - type: web
    name: legal-verifier-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    # 마이그레이션을 먼저 적용한 뒤 기동한다.
    dockerCommand: python -m scripts.start_server
    disk:
      name: lv-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: LV_AUTH_MODE
        value: multi-user
      - key: LV_DATA_DIR
        value: /data
      - key: LV_DATABASE_URL
        fromDatabase:
          name: legal-verifier-db
          property: connectionString
      # Worker를 함께 띄우지 않는다면 inprocess로 두면 Redis 없이 동작한다.
      - key: LV_WORKER_MODE
        value: inprocess
      # 인프로세스에서는 검증이 API와 같은 프로세스를 쓴다. 긴 OCR·검증을
      # 둘씩 돌리면 CPU·메모리가 겹쳐 헬스체크와 진행률 조회가 함께 느려진다.
      # 큐는 DB가 보존하므로 한 번에 하나씩 실행한다. 이 값을 비워 두면
      # 인프로세스 1, 별도 Worker 2가 자동으로 적용된다.
      - key: LV_JOB_CONCURRENCY
        value: "1"
      - key: LV_JOB_DISPATCH_SECONDS
        value: "120"
      - key: LV_JOB_DISPATCH_RETRY_SECONDS
        value: "30"
      - key: LV_DB_POOL_SIZE
        value: "3"
      - key: LV_DB_MAX_OVERFLOW
        value: "2"
      - key: LV_DB_CONNECT_TIMEOUT
        value: "10"
      - key: LV_DB_POOL_TIMEOUT
        value: "30"
      - key: LV_DB_POOL_RECYCLE_SECONDS
        value: "1800"
      - key: LV_OCR_LANG
        value: kor+eng
      - key: LV_REQUIRE_OCR
        value: "1"
      - key: LV_DEFAULT_AI_POLICY
        value: MASKED
      - key: LV_DEFAULT_PROFILE
        value: STANDARD
      - key: LV_ALLOW_NETWORK
        value: "1"
      # 국가법령정보가 느려지는 구간이 실측된다. 12초로는 정상 조회가
      # 시간 초과로 끊겨 실재하는 판례가 미확인으로 남는다.
      - key: LV_HTTP_TIMEOUT
        value: "30"
      - key: LV_SOURCE_LOOKUP_BUDGET_SECONDS
        value: "120"
      - key: LV_SOURCE_LOOKUP_MAX_DOCUMENT_SECONDS
        value: "240"
      - key: LV_SOURCE_LOOKUP_RECOVERY_SECONDS
        value: "30"
      - key: LV_SOURCE_LOOKUP_ATTEMPTS
        value: "2"
      - key: LV_PSEUDONYM_SECRET
        generateValue: true
      # 최초 관리자. 기존 계정도 이 값도 없으면 보호된 API에 접근할 수 없다.
      # 첫 로그인 후 비밀번호를 바꾸고 아래 두 값을 삭제한다.
      - key: LV_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: LV_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: LV_BOOTSTRAP_ADMIN_NAME
        value: 관리자
      - key: LV_SESSION_TTL_HOURS
        value: "24"
      - key: LV_SESSION_ABSOLUTE_HOURS
        value: "168"
      - key: LV_ANALYSIS_SESSION_HOURS
        value: "168"
      - key: LV_ANALYSIS_RESULT_HOURS
        value: "24"
      - key: LV_LAW_GO_KR_OC
        sync: false
      - key: LV_KCI_KEY
        sync: false
      - key: LV_CROSSREF_MAILTO
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: legal-verifier-db
    plan: basic-256mb
    postgresMajorVersion: "16"
