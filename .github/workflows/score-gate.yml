name: 점수 게이트

# 고정 시험(개발 시험·홀드아웃)을 오프라인으로 채점해 기준선(docs/scorecards/baseline.json)과 비교한다.
# 종합점수 하락, 오탐 증가, 문서별 재현율 하락, 인젝션 방어 실패면 실패한다. 봉인 시험은 사용자가 로컬에서 실행한다.
# 회귀 게이트(scripts/regression_gate.py)와 하드코딩 변경분 점검(scripts/check_hardcoding_diff.py)도 같은 잡에서 돈다.
# 병합을 막으려면 기본 브랜치 보호 규칙에서 이 잡('점수 하락 게이트')을 필수 상태 확인으로 지정해야 한다.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 토큰 권한은 저장소 읽기로 제한한다(기본 권한이 저장소 설정에 따라 넓어지는 것을 막는다).
# 이 워크플로는 체크아웃·아티팩트 업로드만 하고 푸시·PR·이슈 쓰기를 하지 않는다.
permissions:
  contents: read

concurrency:
  group: score-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  score-gate:
    name: 점수 하락 게이트
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # shell을 명시해야 bash가 -eo pipefail로 실행된다. 없으면 '| tee' 뒤의 종료 코드가 게이트 실패를 가린다.
    defaults:
      run:
        shell: bash
    env:
      LV_ALLOW_NETWORK: "0"
      LV_PSEUDONYM_SECRET: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # 소급 측정 시험(과거 커밋 작업 폴더)이 전체 이력을 쓴다

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 기준선은 한국어 OCR이 있는 조건에서 만들었다. CI 본 잡과 같은 설치를 쓴다.
      - name: 한국어 OCR 엔진 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng fonts-nanum

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 성적표 작성
        run: python scripts/scorecard.py --out artifacts/scorecard.json | tee artifacts-summary.txt

      # 앞 단계가 실패해도 뒤 단계를 건너뛰지 않는다(6차 독립 감사: 수용 시험 실패 때문에 회귀·하드코딩·버전 검사가 skipped로 남아
      # 새 회귀가 가려졌다). 취소된 실행만 건너뛴다. 하나라도 실패하면 job은 실패다.
      - name: 점수 게이트
        if: ${{ !cancelled() }}
        run: python scripts/score_gate.py --current artifacts/scorecard.json --strict-env | tee -a artifacts-summary.txt

      # 사건 값·서면 문구 하드코딩 차단, 측정 도구 자체 시험, 서면별 항목 시험(알려진 미해결은 strict xfail)
      - name: 수용 시험
        if: ${{ !cancelled() }}
        run: |
          mkdir -p artifacts
          python -m pytest tests/acceptance -p no:cacheprovider -rfE 2>&1 | tee artifacts/pytest-acceptance.txt

      # 지난 라운드들이 고정한 회귀 원장(약 4초). 전체 시험(CI)은 20분 안에 끝나지 못할 수 있어 7차에서 원장 실패 2건이 늦게 드러났다 — 여기서 먼저 잡는다
      - name: 회귀 원장 시험
        if: ${{ !cancelled() }}
        run: |
          mkdir -p artifacts
          python -m pytest tests/regression -p no:cacheprovider -rfE 2>&1 | tee artifacts/pytest-regression.txt

      # 직전 푸시(PR이면 기준 브랜치) 대비: 전에 통과하던 항목이 떨어졌는지(회귀), 새로 추가된 줄에 시험 입력의 값·조문 번호가 들어갔는지(하드코딩)
      - name: 회귀 게이트(항목 단위)
        if: ${{ !cancelled() }}
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD~1; fi
          CARD=""; [ -s artifacts/scorecard.json ] && CARD="--head-scorecard artifacts/scorecard.json"
          python scripts/regression_gate.py --base "$BASE" $CARD | tee -a artifacts-summary.txt

      - name: 하드코딩 변경분 점검
        if: ${{ !cancelled() }}
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD~1; fi
          python scripts/check_hardcoding_diff.py --base "$BASE" | tee -a artifacts-summary.txt

      # 기존 시험을 지우거나 skip·xfail을 붙여 통과시키는 것을 막는다(7차 보완·7C: 원장 기대값 15개 변경, 시험 6개 삭제). 평가 측 커밋만 있는 범위는 건너뛴다.
      - name: 시험 삭제·약화 점검
        if: ${{ !cancelled() }}
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD~1; fi
          python scripts/check_test_edits.py --base "$BASE" | tee -a artifacts-summary.txt

      # 평가 도구·시험 자료·CI 워크플로를 평가 측이 아닌 커밋이 바꾸면 실패한다(같은 SHA CI를 판정에 쓰기 위한 전제, 2026-10-04)
      - name: 보호 경로 변경 점검
        if: ${{ !cancelled() }}
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD~1; fi
          python scripts/check_protected_paths.py --base "$BASE" | tee -a artifacts-summary.txt

      # 버전은 커밋이 아니라 평가 측이 잰 성능으로만 올린다(docs/scorecards/VERSION_POLICY.md). 판정서 없는 상향은 실패.
      - name: 버전 정책 점검
        if: ${{ !cancelled() }}
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD~1; fi
          python scripts/check_version_policy.py --base "$BASE" | tee -a artifacts-summary.txt

      - name: 실패 시험 목록
        if: ${{ failure() }}
        run: python scripts/ci_failed_tests.py artifacts/pytest-acceptance.txt artifacts/pytest-regression.txt

      - name: 요약 게시
        if: always()
        run: |
          {
            echo '### 성적표'
            echo '```'
            cat artifacts-summary.txt 2>/dev/null || echo '(없음)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 성적표 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: artifacts/scorecard.json
          if-no-files-found: ignore
