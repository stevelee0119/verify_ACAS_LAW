name: CI

on:
  push:
    branches: ["main", "claude/**", "codex/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 테스트 (SQLite + PostgreSQL/pgvector + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legal
          POSTGRES_PASSWORD: legal
          POSTGRES_DB: legal_verifier
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U legal -d legal_verifier"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      # 검증에 필요한 외부 Source는 CI에서 호출하지 않는다.
      # 결정론적 엔진만으로 통과해야 한다는 것이 이 잡의 전제이다.
      LV_ALLOW_NETWORK: "0"
      LV_PSEUDONYM_SECRET: ci-only-not-a-real-secret
      # 마이그레이션으로 만들어지는 감사추적 append-only 트리거가 없으면
      # 건너뛰지 말고 실패시킨다.
      LV_REQUIRE_AUDIT_TRIGGER: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 한국어 OCR 엔진 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng fonts-nanum
          tesseract --list-langs

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Install test browser
        run: python -m playwright install --with-deps chromium

      - name: Korean scanned PDF readiness check
        run: python -m scripts.check_ocr_runtime

      - name: 테스트 (SQLite + 인프로세스 Worker)
        run: pytest -q

      - name: 마이그레이션 적용
        env:
          LV_DATABASE_URL: postgresql+psycopg://legal:legal@localhost:5432/legal_verifier
        run: alembic upgrade head

      - name: 테스트 (PostgreSQL/pgvector + Celery 브로커)
        env:
          LV_TEST_DATABASE_URL: postgresql+psycopg://legal:legal@localhost:5432/legal_verifier
          LV_TEST_CELERY_BROKER: redis://localhost:6379/0
        run: pytest -q

  docker-ocr:
    name: Docker OCR readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image and verify OCR
        run: docker build --tag acas-law-ocr-check --file docker/Dockerfile .
      - name: Verify OCR as production user without network
        run: docker run --rm --network none acas-law-ocr-check python -m scripts.check_ocr_runtime
      - name: Verify production startup and migrations on Render port
        run: |
          trap 'docker logs acas-law-startup; docker rm -f acas-law-startup' EXIT
          for mode in default override; do
            command=()
            if [ "$mode" = override ]; then
              command=(python -m scripts.start_server)
            fi
            docker run --detach --name acas-law-startup --network none \
              --env PORT=10000 --env RENDER_SERVICE_ID=srv-ci \
              --env LV_AUTH_MODE=multi-user --env LV_WORKER_MODE=inprocess \
              --env LV_ALLOW_NETWORK=0 --env LV_PSEUDONYM_SECRET=ci-only-not-a-real-secret \
              --env LV_UPLOAD_SMOKE_TEST=1 \
              --env LV_BOOTSTRAP_ADMIN_EMAIL=container-check@example.test \
              --env LV_BOOTSTRAP_ADMIN_PASSWORD=ci-only-upload-test-password \
              acas-law-ocr-check "${command[@]}"
            ready=0
            for attempt in $(seq 1 45); do
              if docker exec acas-law-startup python -c 'import json, urllib.request; response = urllib.request.urlopen("http://127.0.0.1:10000/api/health", timeout=2); assert json.load(response)["status"] == "ok"'; then
                ready=1
                break
              fi
              if [ "$(docker inspect --format '{{.State.Running}}' acas-law-startup)" != true ]; then
                exit 1
              fi
              sleep 2
            done
            test "$ready" = 1
            docker exec acas-law-startup python -m scripts.check_upload_runtime
            docker exec acas-law-startup python -c 'import sqlite3; from alembic.config import Config; from alembic.script import ScriptDirectory; db = sqlite3.connect("file:/data/legal_verifier.db?mode=ro", uri=True); assert {row[0] for row in db.execute("SELECT version_num FROM alembic_version")} == set(ScriptDirectory.from_config(Config("alembic.ini")).get_heads())'
            docker stop --time 15 acas-law-startup
            docker logs acas-law-startup
            docker logs acas-law-startup 2>&1 | grep -q 'Application shutdown complete'
            exit_code=$(docker inspect --format '{{.State.ExitCode}}' acas-law-startup)
            # Uvicorn may re-raise SIGTERM after a graceful shutdown.
            test "$exit_code" = 0 || test "$exit_code" = 143
            docker rm acas-law-startup
          done
          trap - EXIT
