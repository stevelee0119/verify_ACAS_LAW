name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 테스트 (SQLite + PostgreSQL/pgvector + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legal
          POSTGRES_PASSWORD: legal
          POSTGRES_DB: legal_verifier
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U legal -d legal_verifier"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      # 검증에 필요한 외부 Source는 CI에서 호출하지 않는다.
      # 결정론적 엔진만으로 통과해야 한다는 것이 이 잡의 전제이다.
      LV_ALLOW_NETWORK: "0"
      LV_PSEUDONYM_SECRET: ci-only-not-a-real-secret
      # 마이그레이션으로 만들어지는 감사추적 append-only 트리거가 없으면
      # 건너뛰지 말고 실패시킨다.
      LV_REQUIRE_AUDIT_TRIGGER: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 한국어 OCR 엔진 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-kor
          tesseract --list-langs

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 테스트 (SQLite + 인프로세스 Worker)
        run: pytest -q

      - name: 마이그레이션 적용
        env:
          LV_DATABASE_URL: postgresql+psycopg://legal:legal@localhost:5432/legal_verifier
        run: alembic upgrade head

      - name: 테스트 (PostgreSQL/pgvector + Celery 브로커)
        env:
          LV_TEST_DATABASE_URL: postgresql+psycopg://legal:legal@localhost:5432/legal_verifier
          LV_TEST_CELERY_BROKER: redis://localhost:6379/0
        run: pytest -q
