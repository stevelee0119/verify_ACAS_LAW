# 개발·시연용 구성. 운영에서는 PostgreSQL+pgvector와 외부 Secret Manager를 사용한다.
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # 기본은 SQLite. PostgreSQL 사용 시 아래 주석을 해제한다.
      # LV_DATABASE_URL: postgresql+psycopg://legal:legal@db:5432/legal_verifier
      LV_DATA_DIR: /data
      LV_DEFAULT_AI_POLICY: MASKED
      LV_DEFAULT_PROFILE: STANDARD
      # API Key는 이미지에 굽지 않고 런타임 secret으로 주입한다(제21.2장).
      LV_LAW_GO_KR_OC: ${LV_LAW_GO_KR_OC:-}
      LV_KCI_KEY: ${LV_KCI_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LV_PSEUDONYM_SECRET: ${LV_PSEUDONYM_SECRET:-change-me-in-production}
    volumes:
      - lv-data:/data
    restart: unless-stopped

  # 폐쇄망·기관 배포에서 사용한다(제23장).
  # db:
  #   image: pgvector/pgvector:pg16
  #   environment:
  #     POSTGRES_USER: legal
  #     POSTGRES_PASSWORD: legal
  #     POSTGRES_DB: legal_verifier
  #   volumes:
  #     - lv-db:/var/lib/postgresql/data
  #
  # redis:
  #   image: redis:7-alpine
  #
  # worker:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile
  #   command: celery -A workers.celery_app worker -l info
  #   depends_on: [redis, db]

volumes:
  lv-data:
